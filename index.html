<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Jogo de Plataforma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="portraitNotice">
        <h2>Por favor, vire o seu celular deitado (Modo Paisagem) para jogar!</h2>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="touch-controls">
            <div id="btnEsquerda" class="touch-btn"></div>
            <div id="btnDireita" class="touch-btn"></div>
        </div>
    </div>

    <script src="game.js" defer></script>
</body>
</html>
